name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xorg-dev
          sudo apt-get install -y pkg-config libudev-dev
          sudo apt-get install -y xvfb
      - name: Start Xvfb
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
      - name: Set DISPLAY environment variable
        run: echo "DISPLAY=:99" >> $GITHUB_ENV
      - name: Build binaries for library
        run: cargo build --lib --release
  test-lib:
    runs-on: ubuntu-latest
    needs: build-lib
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xorg-dev
          sudo apt-get install -y pkg-config libudev-dev
          sudo apt-get install -y xvfb
      - name: Start Xvfb
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
      - name: Set DISPLAY environment variable
        run: echo "DISPLAY=:99" >> $GITHUB_ENV
      - name: Test library
        run: cargo test --release

  # The jobs below exercise the library without `std`, so they pull no system
  # library and stay independent of the desktop-side stack (probe-rs, OpenGL).
  check-features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [ "", "alloc", "swd" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check library without default features
        run: cargo check --lib --no-default-features --features "${{ matrix.features }}"

  check-targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - thumbv6m-none-eabi
          - riscv32imac-unknown-none-elf
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build core no_std
        run: cargo build --lib --no-default-features --target ${{ matrix.target }}
      - name: Build with the swd bridge
        run: cargo build --lib --no-default-features --features swd --target ${{ matrix.target }}
